<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MusicVerse adalah pemutar musik untuk Android. Tempel tautan playlist, putar di latar belakang, simpan lagu buat offline. Tanpa akun, tanpa iklan." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MusicVerse: pemutar musik untuk Android" />
    <meta property="og:description" content="Tempel tautan playlist, putar di latar belakang, simpan lagu buat offline. Tanpa akun, tanpa iklan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MusicVerse | Pemutar musik untuk Android</title>
    <style>
      /* Splash tampil sebelum CSS/JS aplikasi dimuat (hanya di APK, lihat skrip di bawah). Semua gerakan hanya memakai
         transform + opacity (jalur compositor, tetap mulus saat thread utama sibuk memuat aplikasi), dan ukuran dasarnya
         adalah ukuran akhir (zoom dari kecil ke 1) supaya teks tidak buram. Easing ditulis literal: variabel CSS aplikasi belum ada. */
      html.has-splash body { background: #121212; }
      html.no-splash #splash { display: none; }
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; background: #121212;
        transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1) 80ms;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      /* Zoom pelan selama splash tampil, lalu tahan di ukuran akhir. */
      .splash-zoom {
        will-change: transform;
        animation: splash-zoom 2800ms cubic-bezier(0.22, 0.6, 0.3, 1) both;
      }
      /* Saat keluar: membesar cepat menembus layar (transisi; animasi zoom di atasnya sudah selesai / hampir diam). */
      .splash-group {
        display: flex; flex-direction: column; align-items: center; gap: 24px;
        will-change: transform;
        transition: transform 680ms cubic-bezier(0.55, 0, 0.85, 0.4);
      }
      #splash.splash-hide .splash-group { transform: scale3d(2.2, 2.2, 1); }
      /* Logo: 4 batang HTML (bukan SVG) supaya animasinya dikomposit GPU. Koordinat = viewBox 32 dari logo aslinya. */
      .splash-logo {
        position: relative; width: 138px; height: 138px;
        will-change: transform, opacity;
        animation: splash-logo 600ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .splash-logo i {
        position: absolute; display: block; border-radius: 999px; background: #1db954;
        transform-origin: 50% 100%;
        will-change: transform;
        animation: splash-bar 760ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-logo i:nth-child(1) { left: 18.75%; top: 43.75%; width: 10.94%; height: 25%; }
      .splash-logo i:nth-child(2) { left: 35.94%; top: 28.13%; width: 10.94%; height: 56.25%; animation-delay: 80ms; }
      .splash-logo i:nth-child(3) { left: 53.13%; top: 15.63%; width: 10.94%; height: 68.75%; animation-delay: 160ms; }
      .splash-logo i:nth-child(4) { left: 70.31%; top: 34.38%; width: 10.94%; height: 37.5%; animation-delay: 240ms; }
      .splash-name {
        display: flex; margin: 0;
        font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
        font-size: 45px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: #fff;
      }
      .splash-name span {
        display: inline-block;
        will-change: transform, opacity;
        animation: splash-letter 640ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
        animation-delay: calc(520ms + var(--i, 0) * 55ms);
      }
      .splash-name span:nth-child(1) { --i: 0; }
      .splash-name span:nth-child(2) { --i: 1; }
      .splash-name span:nth-child(3) { --i: 2; }
      .splash-name span:nth-child(4) { --i: 3; }
      .splash-name span:nth-child(5) { --i: 4; }
      .splash-name span:nth-child(6) { --i: 5; }
      .splash-name span:nth-child(7) { --i: 6; }
      .splash-name span:nth-child(8) { --i: 7; }
      .splash-name span:nth-child(9) { --i: 8; }
      .splash-name span:nth-child(10) { --i: 9; }
      @keyframes splash-zoom { from { transform: scale3d(0.68, 0.68, 1); } to { transform: scale3d(1, 1, 1); } }
      @keyframes splash-letter {
        from { opacity: 0; transform: translate3d(0, 18px, 0) scale3d(0.8, 0.8, 1); }
        to { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes splash-logo {
        from { opacity: 0; transform: scale3d(0.8, 0.8, 1); }
        to { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes splash-bar { from { transform: scale3d(1, 0.35, 1); } to { transform: scale3d(1, 1, 1); } }
    </style>
    <script>
      // Splash hanya untuk APK; situs web biasa tidak memakainya. Pengaman: bila aplikasi gagal memudarkannya, hilang sendiri setelah 10 detik.
      try {
        var c = window.Capacitor
        var native = !!(c && c.isNativePlatform && c.isNativePlatform())
        document.documentElement.classList.add(native ? 'has-splash' : 'no-splash')
        if (native) {
          setTimeout(function () {
            var s = document.getElementById('splash')
            document.documentElement.classList.add('app-ready')
            if (s) {
              s.classList.add('splash-hide')
              setTimeout(function () { s.remove() }, 1400)
            }
          }, 10000)
        }
      } catch (e) {
        document.documentElement.classList.add('no-splash')
      }
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-zoom">
        <div class="splash-group">
          <div class="splash-logo"><i></i><i></i><i></i><i></i></div>
          <p class="splash-name"><span>M</span><span>u</span><span>s</span><span>i</span><span>c</span><span>V</span><span>e</span><span>r</span><span>s</span><span>e</span></p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
