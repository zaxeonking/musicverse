name: Build APK

# Rilis OTOMATIS: tiap push ke branch utama, versi dibaca dari package.json (mis. 0.4.34 -> tag v0.4.34).
# - Release v<versi> BELUM ada di repo rilis  -> APK dibuild, ditandatangani, lalu dirilis dengan tag itu.
# - Release v<versi> SUDAH ada                -> dilewati (push biasa tanpa naik versi tidak membuild APK lagi;
#   perubahan tampilan sampai ke pengguna lewat ota.yml).
# Cukup naikkan "version" di package.json lalu push. Jalankan manual (workflow_dispatch) dengan force=true
# untuk membuild ulang dan menimpa APK di rilis versi yang sama.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build ulang dan timpa APK walau rilis versi ini sudah ada'
        type: boolean
        default: false

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write # membuat GitHub Release + melampirkan APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repo TEMPAT RILIS (harus public supaya APK/web bisa membacanya tanpa login). Isi variabel repo
      # RELEASE_REPO (Settings > Secrets and variables > Actions > Variables) mis. USER/musicverse-releases.
      # Kosong = zaxeonking/musicverse-releases (bawaan).
      RELEASE_REPO: ${{ vars.RELEASE_REPO || 'zaxeonking/musicverse-releases' }}
      VITE_GITHUB_REPO: ${{ vars.RELEASE_REPO || 'zaxeonking/musicverse-releases' }}
    steps:
      - uses: actions/checkout@v4

      - name: Baca versi dari package.json dan cek rilis
        id: ver
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN belum diisi (PAT dengan izin Contents: Read and write pada repo rilis $RELEASE_REPO)."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" = "true" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Rilis $TAG sudah ada, force=true: build ulang dan timpa APK."
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Rilis $TAG sudah ada di $RELEASE_REPO: build APK dilewati. Naikkan version di package.json untuk rilis baru."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Rilis $TAG belum ada: APK akan dibuild dan dirilis."
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.build == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Periksa secret penandatanganan
        if: steps.ver.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - if: steps.ver.outputs.build == 'true'
        run: npm install --no-audit --no-fund

      - if: steps.ver.outputs.build == 'true'
        run: npm run build

      - name: Siapkan proyek Android
        if: steps.ver.outputs.build == 'true'
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          node scripts/setup-android.mjs

      - name: Build APK release (belum bertanda tangan)
        if: steps.ver.outputs.build == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tanda tangani APK
        if: steps.ver.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          # Buang karakter baris baru yang sering ikut tertempel di akhir secret password.
          KEYSTORE_PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n ')"
          KEY_PASS="$(printf '%s' "${KEY_PASS:-}" | tr -d '\r\n')"
          echo "Keystore hasil decode: $(stat -c%s "$RUNNER_TEMP/release.jks") byte"
          echo "sha256: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)"
          echo "panjang password: ${#KEYSTORE_PASS} karakter; alias: ${#KEY_ALIAS} karakter"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASS" > "$RUNNER_TEMP/keytool.log" 2>&1; then
            sed 's/^/keytool: /' "$RUNNER_TEMP/keytool.log" | head -5
            echo "::error::Keystore tidak bisa dibuka. Bandingkan sha256 di atas dengan 'sha256sum musicverse.jks' di Termux: beda = secret ANDROID_KEYSTORE_BASE64 rusak; sama = password salah / ada karakter tersembunyi."
            exit 1
          fi
          grep -qi "$KEY_ALIAS" "$RUNNER_TEMP/keytool.log" || { echo "::error::Alias '$KEY_ALIAS' tidak ada di keystore. Isi:"; grep -i "PrivateKeyEntry\|trustedCertEntry" "$RUNNER_TEMP/keytool.log"; exit 1; }
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASS:-$KEYSTORE_PASS}" \
            --out musicverse.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs musicverse.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.build == 'true'
        with:
          name: musicverse-apk
          path: musicverse.apk

      - name: Buat / perbarui GitHub Release
        if: steps.ver.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          EXISTS: ${{ steps.ver.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$EXISTS" = "true" ]; then
            gh release upload "$TAG" musicverse.apk --repo "$RELEASE_REPO" --clobber
          else
            # Catatan rilis: pakai CHANGES-<versi>.md kalau ada, kalau tidak dibuat otomatis.
            NOTES="CHANGES-${{ steps.ver.outputs.version }}.md"
            if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
            gh release create "$TAG" musicverse.apk \
              --repo "$RELEASE_REPO" \
              --title "MusicVerse ${TAG}" \
              "${NOTES_ARG[@]}"
          fi
